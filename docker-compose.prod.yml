# ===========================================
# Berger WMS — Docker Compose (Production Override)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ===========================================
services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - app_public:/var/www/html/public:ro
    restart: always

  php-fpm:
    build:
      target: production
    volumes: []
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    restart: always

  horizon:
    build:
      target: production
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: always

  scheduler:
    build:
      target: production
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: always

  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    restart: always

  redis:
    ports: []
    restart: always

  soketi:
    environment:
      SOKETI_DEBUG: "0"
    restart: always

volumes:
  app_public:
    driver: local
