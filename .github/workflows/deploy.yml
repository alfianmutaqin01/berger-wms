# ===========================================
# Berger WMS — CD Pipeline (Test -> Deploy ke VPS)
# ===========================================
#
# Dipicu oleh tag rilis:  git tag v1.0.0 && git push origin v1.0.0
#
# ALURNYA
#   1. Seluruh lint + test dijalankan ulang untuk tag itu (test.yml).
#   2. Bila hijau, server menarik tag tersebut lewat SSH dan membangun image
#      di server sendiri (docker-compose.prod.yml).
#   3. Migrasi dijalankan, lalu /health diperiksa lewat domain HTTPS-nya.
#      Deploy yang /health-nya tidak sehat ditandai GAGAL.
#
# KENAPA DIBANGUN DI SERVER, BUKAN DI-PUSH KE REGISTRY
# ----------------------------------------------------
# Versi sebelumnya membangun dan mengunggah image ke GHCR, lalu server
# mengabaikannya dan membangun ulang dari kode. Dua jalur yang tidak saling
# memakai hanya menambah tempat untuk rusak. Satu VPS, satu jalur.
#
# Secret yang dibutuhkan (Settings -> Environments -> production):
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, SERVER_SSH_FINGERPRINT
#
# PENGAMANAN PIPELINE (audit keamanan)
#   - Environment `production` WAJIB diberi "Required reviewers": tag yang
#     didorong siapa pun tidak langsung terpasang tanpa persetujuan orang
#     kedua. Diatur di GitHub, bukan di berkas ini — docs/9 §11.
#   - SERVER_SSH_FINGERPRINT: sidik jari kunci host server. Tanpanya klien
#     SSH menerima server mana pun yang menjawab di alamat itu, termasuk
#     penyadap di tengah jalan.
#   - Action dikunci ke commit SHA — alasannya di test.yml.
name: CD — Test & Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    needs: test
    environment: production
    # Dua deploy tidak boleh berjalan bersamaan di server yang sama.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/berger-wms

            git fetch --all --tags --force
            git checkout --force ${{ github.ref_name }}

            COMPOSE="docker compose -f docker-compose.prod.yml"

            # Cadangan tepat sebelum migrasi: kalau migrasi rilis ini merusak
            # data, ada titik pulih dari beberapa detik sebelumnya, bukan
            # dari dini hari tadi.
            $COMPOSE exec -T backup sh /skrip/cadangkan.sh sekarang || echo "PERINGATAN: cadangan pra-deploy gagal"

            $COMPOSE build
            $COMPOSE up -d --remove-orphans

            $COMPOSE exec -T -u www-data php-fpm php artisan migrate --force

            # Worker antrean memuat kode saat start; minta berhenti setelah
            # pekerjaan yang sedang jalan, lalu `restart: always` menghidupkannya
            # dengan kode baru.
            $COMPOSE exec -T -u www-data php-fpm php artisan queue:restart

            DOMAIN=$(grep '^APP_DOMAIN=' .env | cut -d= -f2 | tr -d '"')
            for i in 1 2 3 4 5 6; do
              if curl -fsS "https://$DOMAIN/health"; then
                echo
                echo "Deployed: ${{ github.ref_name }}"
                exit 0
              fi
              sleep 10
            done

            echo "/health tidak sehat setelah deploy ${{ github.ref_name }}"
            exit 1
