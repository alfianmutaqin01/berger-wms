# ===========================================
# Berger WMS — CI Pipeline (Lint + Test)
# ===========================================
name: CI — Lint & Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Dipanggil deploy.yml: rilis hanya dipasang bila test untuk tag yang sama hijau.
  workflow_call:

# Token bawaan hanya boleh membaca kode. Action pihak ketiga yang disusupi
# tidak bisa mendorong commit atau mengubah rilis dengan token ini.
#
# SETIAP ACTION DIKUNCI KE COMMIT SHA, bukan tag (@v4). Tag bisa dipindahkan
# pemilik repositori action — atau penyerang yang membobolnya — ke kode lain,
# dan kode itu berjalan di pipeline yang memegang kunci SSH server. Pembaruan
# SHA diusulkan Dependabot (.github/dependabot.yml) lewat PR yang ditinjau.
permissions:
  contents: read

jobs:
  # === Job 1: PHP Lint ===
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      # Pakai Laravel Pint (sudah ada di require-dev), bukan php-cs-fixer.
      # Tanpa `|| true` — pelanggaran style HARUS menggagalkan pipeline,
      # kalau tidak, langkah lint ini tidak ada gunanya.
      - name: Check Code Style
        run: ./vendor/bin/pint --test

  # === Job 2: Run Tests ===
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wms_testing
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, gd, zip, pcntl, bcmath

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.ci .env
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wms_testing
          DB_USERNAME: wms_test
          DB_PASSWORD: testing

      - name: Execute Tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wms_testing
          DB_USERNAME: wms_test
          DB_PASSWORD: testing
          CACHE_STORE: array
          REDIS_HOST: 127.0.0.1
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
