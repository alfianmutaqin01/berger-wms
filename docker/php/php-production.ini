; ===========================================
; Berger WMS — penimpa khusus image production
; ===========================================
; Dimuat SETELAH custom.ini (nama berkas diawali zz-), jadi nilai di sini
; yang berlaku.

; Kode di dalam image tidak pernah berubah; memeriksa mtime tiap permintaan
; hanya membuang waktu. Deploy selalu membuat container baru, yang otomatis
; mengosongkan OPcache.
opcache.validate_timestamps=0

; Sesi PHP bawaan tidak dipakai Laravel, tetapi kalau ada yang menyentuhnya,
; cookie-nya hanya boleh lewat HTTPS.
session.cookie_secure=1
