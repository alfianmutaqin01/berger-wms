# Berger WMS - Nginx Server Configuration

# Batas laju HANYA untuk POST /login (percobaan masuk), bukan membuka halamannya.
#
# Kuncinya IP. Staf gudang dan kantor keluar ke internet lewat SATU IP yang
# sama; batas lama (5/menit, termasuk GET) membuat pergantian shift pagi —
# belasan orang membuka halaman login bersamaan — berakhir 503. Permintaan
# GET memberi kunci kosong, dan nginx tidak membatasi kunci kosong. Tebakan
# sandi per akun sudah dikunci aplikasi (lockout + reCAPTCHA).
map $request_method $kunci_login {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $kunci_login zone=login:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # IP ASLI PENGGUNA. Di production nginx duduk di belakang Caddy; tanpa ini
    # setiap permintaan tampak datang dari IP container Caddy, sehingga batas
    # laju di atas berlaku untuk SEMUA pengguna sekaligus dan log login
    # mencatat IP yang sama untuk semua orang. Hanya dipercaya dari jaringan
    # internal Docker, supaya header X-Forwarded-For kiriman luar tidak bisa
    # memalsukannya.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
    gzip_vary on;

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # DNS internal Docker, dibaca ulang tiap 10 detik.
        #
        # Tanpa dua baris ini, nginx menerjemahkan nama "php-fpm" SEKALI saat
        # start lalu menyimpan alamat IP-nya selamanya. Begitu container
        # php-fpm dibuat ulang (mis. `docker compose up -d` setelah mengubah
        # docker-compose.yml), ia mendapat IP baru dan SELURUH halaman
        # menjawab 502 Bad Gateway sampai nginx ikut di-restart — padahal
        # aplikasinya sendiri sehat. Memakai variabel memaksa nginx
        # menerjemahkan nama itu saat permintaan datang, bukan saat start.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_php php-fpm:9000;

        fastcgi_pass $upstream_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffering off;
    }

    location = /login {
        limit_req zone=login burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /storage/delivery-proofs {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
